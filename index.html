<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PORTFOLIO.EXE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

/* ============================================================
   EDIT YOUR CONTENT HERE — see the DATA object in the <script>
   near the bottom of this file. Everything below is presentation.
   ============================================================ */

:root{
  --bg:        #0000AA;   /* classic DOS blue */
  --bg-dark:   #000066;
  --cyan:      #55FFFF;
  --white:     #FFFFFF;
  --yellow:    #FFFF55;
  --magenta:   #FF55FF;
  --gray:      #AAAAAA;
  --green:     #55FF55;
  --black:     #000000;
  --char: 1ch;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0; height:100%;
  background:#000;
  color:var(--white);
  font-family:'VT323', 'Courier New', monospace;
  overflow:hidden;
}

#screen{
  position:relative;
  width:100%; height:100vh;
  background:var(--bg);
  display:flex; flex-direction:column;
  padding:18px 22px 8px;
  font-size:20px;
  line-height:1.25;
}

/* CRT scanline + flicker overlay */
#crt{
  pointer-events:none;
  position:fixed; inset:0; z-index:50;
  background:repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.18) 0px,
    rgba(0,0,0,0.18) 1px,
    transparent 1px,
    transparent 3px
  );
  mix-blend-mode:multiply;
}
#crt::after{
  content:"";
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.45) 100%);
}
@keyframes flicker{
  0%,100%{ opacity:1; }
  92%{ opacity:1; }
  93%{ opacity:0.86; }
  94%{ opacity:1; }
}
#screen{ animation: flicker 7s infinite; }
@media (prefers-reduced-motion: reduce){
  #screen{ animation:none; }
  #crt{ display:none; }
}

/* ---------- boot sequence ---------- */
#boot{
  position:absolute; inset:0;
  background:#000;
  color:var(--green);
  padding:24px 28px;
  font-size:20px;
  white-space:pre-wrap;
  z-index:40;
  cursor:pointer;
}
#boot .hint{
  color:var(--gray);
  margin-top:1.5em;
}
#boot.hidden{ display:none; }

/* ---------- header ---------- */
header{
  color:var(--yellow);
  white-space:pre;
  font-size:16px;
  line-height:1.05;
  text-align:center;
  margin-bottom:6px;
  user-select:none;
}
.subtitle{
  text-align:center;
  color:var(--cyan);
  letter-spacing:.3em;
  font-size:16px;
  margin-bottom:10px;
}

/* ---------- main layout ---------- */
#main{
  flex:1;
  display:flex;
  gap:18px;
  min-height:0;
}

.box{
  border:2px solid var(--cyan);
  position:relative;
  padding:14px 16px;
}
.box::before{
  content:attr(data-title);
  position:absolute;
  top:-13px; left:16px;
  background:var(--bg);
  padding:0 8px;
  color:var(--yellow);
  letter-spacing:.05em;
}

#menu-panel{
  width:280px;
  flex-shrink:0;
  display:flex; flex-direction:column;
}
#menu-list{
  list-style:none; margin:8px 0 0; padding:0;
}
#menu-list li{
  padding:4px 10px;
  cursor:pointer;
  color:var(--white);
}
#menu-list li .num{ color:var(--cyan); margin-right:10px; }
#menu-list li.active{
  background:var(--magenta);
  color:var(--black);
}
#menu-list li.active .num{ color:var(--black); }
#menu-list li:hover:not(.active){
  background:var(--bg-dark);
}
#menu-help{
  margin-top:auto;
  color:var(--gray);
  font-size:16px;
  border-top:1px solid var(--bg-dark);
  padding-top:8px;
}

#content-panel{
  flex:1;
  min-width:0;
  overflow-y:auto;
  display:flex; flex-direction:column;
}
#content-panel h2{
  margin:0 0 10px;
  color:var(--yellow);
  font-weight:normal;
  font-size:24px;
  letter-spacing:.05em;
}
#content-body{ color:var(--white); font-size:20px; }
#content-body p{ margin:0 0 12px; }
#content-body a{ color:var(--cyan); }
#content-body a:hover{ color:var(--yellow); }

/* skill bars */
.skill-row{
  display:flex; align-items:center; gap:10px;
  margin-bottom:8px;
}
.skill-name{ width:150px; flex-shrink:0; }
.skill-bar{ color:var(--green); letter-spacing:1px; }
.skill-bar .empty{ color:var(--bg-dark); }

/* projects */
.proj-item{
  border-left:2px solid var(--bg-dark);
  padding-left:10px;
  margin-bottom:14px;
  cursor:pointer;
}
.proj-item:hover, .proj-item.open{
  border-left-color:var(--magenta);
}
.proj-title{ color:var(--cyan); }
.proj-title::before{ content:"▸ "; color:var(--yellow); }
.proj-item.open .proj-title::before{ content:"▾ "; }
.proj-detail{
  display:none;
  margin-top:6px;
  color:var(--gray);
}
.proj-item.open .proj-detail{ display:block; }

/* contact */
.contact-row{ margin-bottom:8px; }
.contact-row .label{ color:var(--cyan); display:inline-block; width:110px; }

/* status bar */
#status{
  margin-top:10px;
  background:var(--cyan);
  color:var(--bg);
  padding:3px 12px;
  font-size:16px;
  display:flex; justify-content:space-between;
  letter-spacing:.03em;
}

.cursor{
  display:inline-block;
  width:.55em; height:1em;
  background:var(--white);
  vertical-align:text-bottom;
  animation:blink 1s steps(1) infinite;
  margin-left:2px;
}
@keyframes blink{ 50%{ opacity:0; } }
@media (prefers-reduced-motion: reduce){
  .cursor{ animation:none; }
}

@media (max-width:720px){
  #screen{ font-size:16px; padding:10px; }
  #main{ flex-direction:column; overflow-y:auto; }
  #menu-panel{ width:auto; }
  header{ font-size:11px; }
}
</style>
</head>
<body>

<div id="crt"></div>

<div id="boot">
<div id="boot-text"></div>
<div class="hint" id="boot-hint" style="display:none;">Press any key to continue_</div>
</div>

<div id="screen">
  <header id="ascii-title"></header>
  <div class="subtitle">A A D I T Y  S E T U</div>

  <div id="main">
    <nav id="menu-panel" class="box" data-title="MAIN MENU">
      <ul id="menu-list"></ul>
      <div id="menu-help">↑↓ select · ENTER open<br>or just click an item</div>
    </nav>

    <section id="content-panel" class="box" data-title="VIEWER">
      <h2 id="content-heading"></h2>
      <div id="content-body"></div>
    </section>
  </div>

  <div id="status">
    <span id="status-left">C:\PORTFOLIO&gt;<span class="cursor"></span></span>
    <span id="status-right">F1-HELP&nbsp;&nbsp;F10-EXIT&nbsp;&nbsp;INS</span>
  </div>
</div>

<script>
/* ============================================================
   EDIT YOUR CONTENT HERE. Everything the visitor reads lives
   in this DATA object. Replace the sample values with your own.
   ============================================================ */
const DATA = {
  name: "AADITY SETU",
  tagline: "Computer Science Generalist // Retro Computing Enthusiast",

  about: {
    heading: "ABOUT.DAT",
    body: `<p>Hello weary traveller! You have entered an area of the internet owned by @lord-of-the-strings, that is, me!</p>
    <p> I am Aadity Setu, a 19 year old computer science generalist with a keen interest in systems software and algorithms.
<p>I care about software that's fast, small, and doesn't waste anyone's
time — including the person who has to maintain it later. This site is
built on that same idea: no frameworks, no build step, just files.</p>
<p>Based in <span style="color:var(--yellow)">Ranchi, India</span>.
Currently a learner who is open to and enthusiastic about open source projects and work.</p>`
  },

  skills: {
    heading: "SKILLS.SYS",
    items: [
      { name: "C", level: 9 },
      { name: "C++",     level: 6 },
      { name: "CSS/Design", level: 5 },
      { name: "SQL",        level: 9 },
      { name: "Java",         level: 9 },
      { name: "Python", level: 9},
      { name: "Rust", level: 6}
    ]
  },

  projects: {
    heading: "PROJECTS.EXE",
    items: [
      {
        title: "Project-Micro",
        detail: "My experimentation with making a tiny linux distro that boots from a floppy on an i386 PC",
        link: "github.com/lord-of-the-strings/Project-Micro"
      },
      {
        title: "Parallel Gradient Descent",
        detail: "An unnnecessarily over-engineered experimentation with parallelism and memory corruption in pure C with some GNU stuff. The learning rate is stored in .text section of the code itself which it self-patches and spawns a stunning number of workers for mundane tasks that hardly justify the overhead.",
        link: "github.com/lord-of-the-strings/Parallel-Gradient-Descent"
      },
      {
        title: "htype",
        detail: "A bot that mimics the behaviour of a human typist. This project inspired clack by @ThisWasAryan.",
        link: "github.com/lord-of-the-strings/htype"
      },
      {
         title: "bookstore",
         detail: "An online marketplace for second hand books currently under development. A Flutter-SpringBoot-PostgreSQL project."
      },
    ]
  },

  contact: {
    heading: "CONTACT.COM",
    rows: [
      { label: "EMAIL:",    value: "aaditysetu@gmail.com", href: "mailto:aaditysetu@gmail.com" },
      { label: "GITHUB:",   value: "github.com/lord-of-the-strings", href: "github.com/lord-of-the-strings" },
    ]
  }
};

/* ============================================================
   Rendering — you shouldn't need to touch anything below this
   line unless you want to change how things behave.
   ============================================================ */

const ASCII_TITLE = `
██████╗  ██████╗ ██████╗ ████████╗███████╗ ██████╗ ██╗     ██╗ ██████╗
██╔══██╗██╔═══██╗██╔══██╗╚══██╔══╝██╔════╝██╔═══██╗██║     ██║██╔═══██╗
██████╔╝██║   ██║██████╔╝   ██║   █████╗  ██║   ██║██║     ██║██║   ██║
██╔═══╝ ██║   ██║██╔══██╗   ██║   ██╔══╝  ██║   ██║██║     ██║██║   ██║
██║     ╚██████╔╝██║  ██║   ██║   ██║     ╚██████╔╝███████╗██║╚██████╔╝
╚═╝      ╚═════╝ ╚═╝  ╚═╝   ╚═╝   ╚═╝      ╚═════╝ ╚══════╝╚═╝ ╚═════╝`;

document.getElementById('ascii-title').textContent = ASCII_TITLE;

const menuDefs = [
  { key: 'about',    file: 'ABOUT.DAT',    render: renderAbout },
  { key: 'skills',   file: 'SKILLS.SYS',   render: renderSkills },
  { key: 'projects', file: 'PROJECTS.EXE', render: renderProjects },
  { key: 'contact',  file: 'CONTACT.COM',  render: renderContact },
];

let activeIndex = 0;

function buildMenu(){
  const list = document.getElementById('menu-list');
  list.innerHTML = '';
  menuDefs.forEach((item, i) => {
    const li = document.createElement('li');
    li.dataset.index = i;
    li.innerHTML = `<span class="num">${i+1}.</span>${item.file}`;
    li.addEventListener('click', () => selectMenu(i));
    list.appendChild(li);
  });
  updateMenuHighlight();
}

function updateMenuHighlight(){
  document.querySelectorAll('#menu-list li').forEach((li,i)=>{
    li.classList.toggle('active', i === activeIndex);
  });
}

function selectMenu(i){
  activeIndex = i;
  updateMenuHighlight();
  menuDefs[i].render();
}

function bar(level, max=10){
  const filled = '█'.repeat(level);
  const empty = '░'.repeat(max - level);
  return `<span class="skill-bar">${filled}<span class="empty">${empty}</span></span>`;
}

function renderAbout(){
  document.getElementById('content-heading').textContent = DATA.about.heading;
  document.getElementById('content-body').innerHTML = DATA.about.body;
}

function renderSkills(){
  document.getElementById('content-heading').textContent = DATA.skills.heading;
  const rows = DATA.skills.items.map(s => `
    <div class="skill-row">
      <span class="skill-name">${s.name}</span>
      ${bar(s.level)}
    </div>`).join('');
  document.getElementById('content-body').innerHTML =
    `<p style="color:var(--gray)">Self-rated, out of 10. Take with a grain of salt.</p>${rows}`;
}

function renderProjects(){
  document.getElementById('content-heading').textContent = DATA.projects.heading;
  const items = DATA.projects.items.map((p, i) => `
    <div class="proj-item" data-i="${i}">
      <div class="proj-title">${p.title}</div>
      <div class="proj-detail">${p.detail} ${p.link ? `<br><a href="${p.link}" target="_blank" rel="noopener">view project →</a>` : ''}</div>
    </div>`).join('');
  document.getElementById('content-body').innerHTML =
    `<p style="color:var(--gray)">Click a title to expand.</p>${items}`;

  document.querySelectorAll('.proj-item').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('open'));
  });
}

function renderContact(){
  document.getElementById('content-heading').textContent = DATA.contact.heading;
  const rows = DATA.contact.rows.map(r => `
    <div class="contact-row">
      <span class="label">${r.label}</span>
      <a href="${r.href}" target="_blank" rel="noopener">${r.value}</a>
    </div>`).join('');
  document.getElementById('content-body').innerHTML = rows;
}

/* keyboard navigation */
document.addEventListener('keydown', (e) => {
  if (document.getElementById('boot') && !document.getElementById('boot').classList.contains('hidden')) return;
  if (e.key === 'ArrowDown'){ e.preventDefault(); activeIndex = (activeIndex+1) % menuDefs.length; updateMenuHighlight(); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); activeIndex = (activeIndex-1+menuDefs.length) % menuDefs.length; updateMenuHighlight(); }
  if (e.key === 'Enter'){ menuDefs[activeIndex].render(); }
});

/* boot sequence */
const bootLines = [
  "PORTFOLIO-BIOS v2.3  (C) 1990",
  "",
  `MAIN PROCESSOR: ${DATA.name}`,
  "MEMORY TEST : 640K OK",
  "",
  "Loading PORTFOLIO.EXE ...",
  "Mounting ABOUT.DAT ... OK",
  "Mounting SKILLS.SYS ... OK",
  "Mounting PROJECTS.EXE ... OK",
  "Mounting CONTACT.COM ... OK",
  "",
  "Starting session...",
];

function runBoot(){
  const el = document.getElementById('boot-text');
  const hint = document.getElementById('boot-hint');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduced){
    el.textContent = bootLines.join('\n');
    finishBoot();
    return;
  }

  let i = 0;
  function nextLine(){
    if (i < bootLines.length){
      el.textContent += bootLines[i] + '\n';
      i++;
      setTimeout(nextLine, 90 + Math.random()*70);
    } else {
      hint.style.display = 'block';
    }
  }
  nextLine();

  const skip = () => finishBoot();
  document.getElementById('boot').addEventListener('click', skip, { once:true });
  window.addEventListener('keydown', skip, { once:true });
}

function finishBoot(){
  const boot = document.getElementById('boot');
  boot.classList.add('hidden');
  buildMenu();
  selectMenu(0);
}

runBoot();
</script>
</body>
</html>
